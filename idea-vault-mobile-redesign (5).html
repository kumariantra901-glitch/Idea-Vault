<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12141b;
  --bg-raised:#181b24;
  --surface:#1c2029;
  --surface-hover:#232734;
  --border:rgba(237,235,228,0.09);
  --border-strong:rgba(237,235,228,0.16);
  --text:#edebe4;
  --text-dim:#9a9caa;
  --text-faint:#61626f;
  --accent-idea:#e0a458;
  --accent-idea-dim:rgba(224,164,88,0.14);
  --accent-question:#8c93e8;
  --accent-question-dim:rgba(140,147,232,0.14);
  --accent-learning:#6fbf9a;
  --accent-learning-dim:rgba(111,191,154,0.14);
  --accent-note:#c98fb0;
  --accent-note-dim:rgba(201,143,176,0.14);
  --danger:#e0785e;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 12px 32px -12px rgba(0,0,0,0.55);
  --font-display:'Fraunces',serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(1200px 600px at 90% -10%, rgba(140,147,232,0.06), transparent 60%),
    radial-gradient(1000px 500px at -10% 20%, rgba(224,164,88,0.05), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(140,147,232,0.35);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important;transition-duration:0.01ms !important;}}

/* ---------- layout ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:230px;flex-shrink:0;
  background:var(--bg-raised);
  border-right:1px solid var(--border);
  padding:22px 14px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:2px 8px 22px 8px;
}
.brand-mark{
  width:30px;height:30px;border-radius:9px;
  background:linear-gradient(135deg, var(--accent-idea), var(--accent-question));
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:16px;color:#14161c;
}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:0.2px;}

.nav-group{margin-bottom:6px;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--text-dim);font-size:14px;font-weight:500;
  margin-bottom:2px;transition:background .15s,color .15s;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--surface);color:var(--text);}
.nav-item.active{background:var(--surface-hover);color:var(--text);border-color:var(--border-strong);}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .15s;}
.nav-item.active .dot{opacity:1;background:var(--accent-question);}
.nav-icon{width:16px;text-align:center;font-size:13px;opacity:.85;}
.nav-count{
  margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--text-faint);
}
.nav-divider{height:1px;background:var(--border);margin:12px 4px;}
.nav-section-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);
  padding:10px 10px 4px;font-weight:600;
}

.sidebar-footer{margin-top:auto;padding-top:12px;}
.mic-fab{
  width:100%;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text);border-radius:var(--radius);padding:12px 14px;
  display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;
  transition:transform .15s, border-color .15s, background .15s;
}
.mic-fab:hover{border-color:var(--accent-question);background:var(--surface-hover);transform:translateY(-1px);}
.mic-fab .mic-dot{
  width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--accent-question), #5b62c9);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;
}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  display:flex;align-items:center;gap:14px;
  padding:18px 32px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(18,20,27,0.85);backdrop-filter:blur(10px);z-index:20;
}
.search-wrap{flex:1;max-width:440px;position:relative;}
.search-wrap input{
  width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:9px 14px 9px 34px;border-radius:999px;font-size:13.5px;outline:none;transition:border-color .15s;
}
.search-wrap input:focus{border-color:var(--accent-question);}
.search-wrap .sicon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:13px;}
.topbar-spacer{flex:1;}
.btn{
  border:1px solid var(--border-strong);background:var(--surface);color:var(--text);
  padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:8px;transition:all .15s;
}
.btn:hover{background:var(--surface-hover);border-color:var(--text-faint);}
.btn-primary{
  background:linear-gradient(135deg, var(--accent-idea), #c9863f);
  border-color:transparent;color:#181205;
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-ghost:hover{color:var(--text);background:var(--surface);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-danger{color:var(--danger);border-color:transparent;background:transparent;}
.btn-danger:hover{background:rgba(224,120,94,0.12);}

.content{flex:1;padding:30px 36px 80px;max-width:1180px;width:100%;margin:0 auto;}

/* ---------- headers ---------- */
.page-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:6px;}
.page-title{font-family:var(--font-display);font-size:32px;font-weight:600;margin:0 0 6px;letter-spacing:-0.3px;}
.page-sub{color:var(--text-dim);font-size:14.5px;margin:0 0 26px;max-width:560px;line-height:1.5;}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px;}
.section-title{font-family:var(--font-display);font-size:18px;font-weight:600;}
.section-link{font-size:12.5px;color:var(--text-dim);}
.section-link:hover{color:var(--accent-question);}

/* ---------- grid / cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:18px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s;
}
.card:hover{transform:translateY(-2px);border-color:var(--border-strong);box-shadow:var(--shadow);}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.9;}
.card.idea::before{background:var(--accent-idea);}
.card.question::before{background:var(--accent-question);}
.card.note::before{background:var(--accent-note);}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.type-chip{
  font-size:10.5px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;font-family:var(--font-mono);
}
.type-chip.idea{background:var(--accent-idea-dim);color:var(--accent-idea);}
.type-chip.question{background:var(--accent-question-dim);color:var(--accent-question);}
.type-chip.note{background:var(--accent-note-dim);color:var(--accent-note);}
.status-pill{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;
  background:var(--surface-hover);color:var(--text-dim);margin-left:auto;white-space:nowrap;
}
.status-pill.st-unanswered{color:var(--text-dim);}
.status-pill.st-exploring{color:var(--accent-question);background:var(--accent-question-dim);}
.status-pill.st-understood{color:var(--accent-learning);background:var(--accent-learning-dim);}
.status-pill.st-keeplearning{color:var(--accent-idea);background:var(--accent-idea-dim);}
.card-title{font-family:var(--font-display);font-size:17px;font-weight:600;line-height:1.32;margin:0 0 8px;}
.card-desc{font-size:13px;color:var(--text-dim);line-height:1.5;margin:0 0 12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--text-faint);font-family:var(--font-mono);}
.progress-track{height:4px;border-radius:3px;background:var(--surface-hover);margin-top:12px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent-idea),#f0c184);border-radius:3px;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.tag{font-size:10.5px;padding:2px 8px;border-radius:999px;background:var(--surface-hover);color:var(--text-dim);}

.empty-state{
  border:1px dashed var(--border-strong);border-radius:var(--radius);padding:44px 30px;
  text-align:center;color:var(--text-dim);
}
.empty-state .e-icon{font-size:26px;margin-bottom:10px;opacity:.7;}
.empty-state h3{font-family:var(--font-display);font-weight:600;color:var(--text);margin:0 0 6px;font-size:17px;}
.empty-state p{font-size:13.5px;margin:0 auto;max-width:340px;line-height:1.55;}

/* ---------- stage tabs (idea board) ---------- */
.stage-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;}
.stage-tab{
  padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--border);
}
.stage-tab.active{color:#181205;background:var(--accent-idea);border-color:transparent;}

/* ---------- overview ---------- */
.overview-hero{
  border:1px solid var(--border);border-radius:20px;padding:34px;margin-bottom:8px;
  background:linear-gradient(160deg, rgba(140,147,232,0.07), rgba(224,164,88,0.04));
  position:relative;overflow:hidden;
}
.overview-hero h1{font-family:var(--font-display);font-weight:600;font-size:30px;margin:0 0 8px;letter-spacing:-0.4px;}
.overview-hero p{color:var(--text-dim);font-size:14.5px;margin:0;max-width:480px;}
.focus-card{
  margin-top:22px;display:flex;align-items:center;gap:16px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
}
.focus-card .fc-ico{
  width:44px;height:44px;border-radius:12px;background:var(--accent-idea-dim);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;
}
.focus-card .fc-body{flex:1;min-width:0;}
.focus-card .fc-title{font-family:var(--font-display);font-weight:600;font-size:16px;margin-bottom:3px;}
.focus-card .fc-stage{font-size:12px;color:var(--text-dim);}
.focus-ring{width:44px;height:44px;flex-shrink:0;}

.thought-strip{
  border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;
  background:var(--surface);display:flex;gap:14px;align-items:flex-start;
}
.thought-strip .ts-ico{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 35% 30%, var(--accent-question), #5b62c9);
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.thought-strip blockquote{margin:0;font-family:var(--font-display);font-size:16px;font-style:italic;line-height:1.5;color:var(--text);}
.thought-strip .ts-time{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:var(--font-mono);}

/* ---------- detail pages ---------- */
.detail-back{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:13px;margin-bottom:18px;}
.detail-back:hover{color:var(--text);}
.detail-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:6px;}
.field-block{margin-bottom:22px;}
.field-label{
  font-family:var(--font-mono);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-faint);margin-bottom:8px;display:flex;align-items:center;gap:8px;
}
.field-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;font-size:14px;line-height:1.6;color:var(--text);
}
.field-box.quote{font-family:var(--font-display);font-size:19px;font-weight:500;line-height:1.45;padding:20px 22px;}
textarea.editable{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;color:var(--text);font-size:14px;line-height:1.6;resize:vertical;min-height:64px;outline:none;
}
textarea.editable:focus{border-color:var(--accent-question);}
input.editable{
  width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 14px;color:var(--text);font-size:14px;outline:none;
}
input.editable:focus{border-color:var(--accent-question);}
.inline-select{
  background:var(--surface);border:1px solid var(--border-strong);color:var(--text);
  padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:600;outline:none;
}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 26px;}

.chain-vis{display:flex;flex-direction:column;align-items:flex-start;gap:0;}
.chain-node{
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);
  background:var(--surface);border:1px solid var(--border);font-size:13.5px;max-width:520px;
}
.chain-node.current{border-color:var(--accent-question);background:var(--accent-question-dim);font-weight:600;}
.chain-connector{width:2px;height:22px;background:linear-gradient(var(--border-strong),var(--border-strong));margin-left:24px;position:relative;}
.chain-connector::after{content:"↓";position:absolute;left:-7px;top:2px;color:var(--text-faint);font-size:12px;}

.link-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);
  border-radius:999px;padding:7px 14px 7px 8px;font-size:13px;margin:0 8px 8px 0;
}
.link-chip .lc-ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;}
.link-chip.idea .lc-ico{background:var(--accent-idea-dim);}
.link-chip.question .lc-ico{background:var(--accent-question-dim);}
.link-chip .lc-x{color:var(--text-faint);margin-left:4px;}
.link-chip .lc-x:hover{color:var(--danger);}

/* ---------- modals ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(8,9,13,0.68);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
  animation:fadein .15s ease;
}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--bg-raised);border:1px solid var(--border-strong);border-radius:18px;
  width:100%;max-width:480px;padding:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);
  animation:popin .18s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes popin{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{font-family:var(--font-display);font-size:21px;margin:0 0 4px;}
.modal .modal-sub{color:var(--text-dim);font-size:13px;margin:0 0 20px;}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
.type-opt{
  border:1px solid var(--border);background:var(--surface);border-radius:var(--radius);
  padding:16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:all .15s;
}
.type-opt:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.type-opt .to-ico{font-size:18px;}
.type-opt .to-label{font-weight:600;font-size:13.5px;}
.type-opt .to-desc{font-size:11.5px;color:var(--text-faint);line-height:1.4;}
.type-opt.idea:hover{border-color:var(--accent-idea);}
.type-opt.question:hover{border-color:var(--accent-question);}
.type-opt.learning:hover{border-color:var(--accent-learning);}
.type-opt.note:hover{border-color:var(--accent-note);}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
.modal-field{margin-bottom:14px;}
.modal-field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}

/* ---------- voice modal ---------- */
.voice-modal{text-align:center;padding:38px 26px;}
.voice-state-label{font-family:var(--font-display);font-size:20px;margin:18px 0 4px;}
.voice-sub{color:var(--text-faint);font-size:13px;margin-bottom:22px;}
.mic-orb{
  width:88px;height:88px;border-radius:50%;margin:0 auto;position:relative;
  background:radial-gradient(circle at 35% 30%, var(--accent-question), #4b52c0);
  display:flex;align-items:center;justify-content:center;font-size:30px;
  box-shadow:0 0 0 0 rgba(140,147,232,0.5);
}
.mic-orb.listening{animation:pulse 1.6s infinite;}
.mic-orb.starting{animation:pulse 0.9s infinite;opacity:.85;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(140,147,232,0.45);}
  70%{box-shadow:0 0 0 22px rgba(140,147,232,0);}
  100%{box-shadow:0 0 0 0 rgba(140,147,232,0);}
}
.voice-sound-toggle{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:4px 0 18px;font-size:12.5px;color:var(--text-dim);user-select:none;cursor:pointer;
}
.voice-sound-toggle input{
  appearance:none;-webkit-appearance:none;width:32px;height:18px;border-radius:999px;
  background:var(--surface-hover);border:1px solid var(--border-strong);position:relative;
  cursor:pointer;transition:background .15s;flex-shrink:0;
}
.voice-sound-toggle input::before{
  content:"";position:absolute;top:1px;left:1px;width:14px;height:14px;border-radius:50%;
  background:var(--text-faint);transition:transform .15s,background .15s;
}
.voice-sound-toggle input:checked{background:rgba(140,147,232,0.35);border-color:var(--accent-question);}
.voice-sound-toggle input:checked::before{transform:translateX(14px);background:var(--accent-question);}
.voice-error-detail{color:var(--text-faint);font-size:12.5px;margin-top:-14px;margin-bottom:18px;line-height:1.5;}
.waveform{display:flex;align-items:center;justify-content:center;gap:4px;height:34px;margin:16px 0 6px;}
.waveform span{
  width:4px;height:28px;border-radius:3px;background:var(--accent-question);
  transform:scaleY(0.12);transform-origin:center;
  transition:transform .07s linear;
}
/* Fallback only: used when we genuinely cannot read microphone levels
   (no AudioContext/AnalyserNode support). Real sessions are driven live
   from JS in updateWaveformLevels(), which overrides this via inline styles. */
.waveform.no-audio-signal span{animation:wave-fallback 1.1s ease-in-out infinite;}
.waveform.no-audio-signal span:nth-child(1){animation-delay:0s;}
.waveform.no-audio-signal span:nth-child(2){animation-delay:.1s;}
.waveform.no-audio-signal span:nth-child(3){animation-delay:.2s;}
.waveform.no-audio-signal span:nth-child(4){animation-delay:.3s;}
.waveform.no-audio-signal span:nth-child(5){animation-delay:.4s;}
.waveform.no-audio-signal span:nth-child(6){animation-delay:.5s;}
.waveform.no-audio-signal span:nth-child(7){animation-delay:.6s;}
@keyframes wave-fallback{0%,100%{transform:scaleY(0.25);}50%{transform:scaleY(0.85);}}
.transcript-box{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;font-family:var(--font-display);font-size:16px;line-height:1.5;
  text-align:left;margin:18px 0;min-height:60px;
}
.voice-fallback{color:var(--text-dim);font-size:13.5px;line-height:1.6;}

/* ---------- search ---------- */
.filter-tabs{display:flex;gap:6px;margin-bottom:20px;}
.filter-tab{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--text-dim);background:var(--surface);border:1px solid var(--border);}
.filter-tab.active{color:var(--text);background:var(--surface-hover);border-color:var(--border-strong);}

/* ---------- learning ---------- */
.topic-group{margin-bottom:28px;}
.topic-heading{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;}

/* ---------- toast ---------- */
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--bg-raised);border:1px solid var(--border-strong);color:var(--text);
  padding:11px 20px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);z-index:200;
  display:flex;align-items:center;gap:8px;animation:toastin .2s ease;
}
@keyframes toastin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- mobile ---------- */
.hamburger{display:none;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;width:36px;height:36px;align-items:center;justify-content:center;color:var(--text);}
@media (max-width:767px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,0.5);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex;}
  .content{padding:22px 18px 80px;}
  .topbar{padding:14px 16px;}
  .search-wrap{max-width:none;}
  .modal{max-width:96vw;}
  .sidebar-scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:55;}
  .sidebar-scrim.show{display:block;}
}
@media (max-width:520px){
  .btn span.btn-text{display:none;}
  .type-grid{grid-template-columns:1fr;}
}

/* ============================================================
   MOBILE-ONLY REDESIGN — header polish + Overview / empty state
   Scoped strictly to <=767px via extra specificity or !important
   only where an inline style must be overridden. Nothing here
   touches tablet/desktop rules above, and no class, id, or JS
   hook is renamed — this is purely additive.
   ============================================================ */
@media (max-width:767px){

  /* ---- header: compact, nothing touches the edges ---- */
  .topbar{gap:8px;padding:12px 14px;}
  .hamburger{width:38px;height:38px;flex-shrink:0;}
  .search-wrap{min-width:0;}
  .search-wrap input{padding:9px 10px 9px 30px;font-size:12.5px;}
  .search-wrap .sicon{left:11px;font-size:12px;}
  /* .topbar-spacer also carries flex:1 for the desktop layout, which
     was splitting the row's free space evenly with .search-wrap and
     crushing the input on small screens — neutralize it here only. */
  .topbar-spacer{flex:0;}
  .topbar > .btn-ghost{padding:8px;width:38px;height:38px;justify-content:center;flex-shrink:0;}
  .topbar > .btn-primary{padding:8px 14px;flex-shrink:0;}

  /* ---- overview hero: editorial, not a boxed card ---- */
  .overview-hero{
    border:none;
    background:none;
    border-radius:0;
    padding:4px 2px 0;
    margin-bottom:4px;
    position:relative;
    overflow:visible;
    z-index:0;
  }
  /* extremely subtle ambient warmth — almost subconscious, no visible blob */
  .overview-hero::before{
    content:"";
    position:absolute;
    top:-10px; left:-10px;
    width:180px; height:150px;
    background:radial-gradient(circle, rgba(224,164,88,0.09), transparent 70%);
    pointer-events:none;
    z-index:-1;
  }
  .overview-hero .page-eyebrow{font-size:10.5px;letter-spacing:1.6px;margin-bottom:8px;}
  .overview-hero h1{
    font-size:clamp(1.45rem, 6.2vw, 1.85rem);
    line-height:1.22;
    letter-spacing:-0.3px;
    margin:0 0 10px;
  }
  .overview-hero p{
    font-size:14px;
    line-height:1.55;
    max-width:none;
    color:var(--text-dim);
  }
  .overview-hero .focus-card{margin-top:18px;}

  /* ---- primary CTA + secondary actions: hierarchy, not competing boxes ---- */
  .hero-actions{
    display:flex !important;
    flex-direction:column !important;
    align-items:stretch !important;
    gap:0 !important;
    margin-top:20px !important;
  }
  .hero-actions .btn-primary{
    width:100%;
    justify-content:center;
    padding:14px 20px;
    font-size:14.5px;
    border-radius:999px;
    box-shadow:0 10px 24px -10px rgba(224,164,88,0.45);
    margin-bottom:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .hero-actions .btn-primary:active{
    transform:scale(.97);
    box-shadow:0 6px 16px -8px rgba(224,164,88,0.5);
  }
  .hero-actions .btn-ghost{
    background:none;
    border:none;
    border-top:1px solid var(--border);
    border-radius:0;
    padding:13px 2px;
    justify-content:flex-start;
    font-size:13.5px;
    font-weight:500;
    color:var(--text-dim);
    min-height:44px;
    width:100%;
    transition:color .15s ease, padding-left .15s ease;
  }
  .hero-actions .btn-ghost:last-child{border-bottom:1px solid var(--border);}
  .hero-actions .btn-ghost:active{color:var(--accent-idea);padding-left:6px;background:none;}

  /* ---- empty state directly under the hero: quiet continuation, no second box ---- */
  .overview-hero + .empty-state{
    border:none;
    padding:20px 2px 4px;
    text-align:left;
    margin-top:2px;
  }
  .overview-hero + .empty-state .e-icon{
    font-size:19px;
    margin-bottom:8px;
    opacity:.65;
    animation:ivEmptyIconIn .5s ease both;
  }
  .overview-hero + .empty-state h3{font-size:15.5px;margin:0 0 6px;}
  .overview-hero + .empty-state p{font-size:13px;line-height:1.6;max-width:none;margin:0;}
}

@keyframes ivEmptyIconIn{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:.65;transform:translateY(0);}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   IDEA VAULT — state, storage, and app shell
   ============================================================ */

const STORAGE_KEY = 'ideavault_state_v1';

const STAGES = [
  {id:'inbox', label:'Inbox', icon:'✦'},
  {id:'brewing', label:'Brewing', icon:'♨'},
  {id:'nextup', label:'Next Up', icon:'▸'},
  {id:'building', label:'Building', icon:'⚒'},
  {id:'polishing', label:'Polishing', icon:'✺'},
  {id:'shipped', label:'Shipped', icon:'✓'},
  {id:'archive', label:'Archive', icon:'☐'},
];

const Q_STATUSES = [
  {id:'unanswered', label:'Unanswered', icon:'❓'},
  {id:'exploring', label:'Exploring', icon:'🔎'},
  {id:'understood', label:'Understood', icon:'✅'},
  {id:'keeplearning', label:'Keep Learning', icon:'📚'},
];

function uid(){ return 'id_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function now(){ return Date.now(); }

/* Truly empty starting point for a brand-new user/device.
   No hard-coded personal entries are created here — see demoState()
   below for the separate, opt-in "View example" preview content. */
function emptyVaultState(){
  return {
    ideas:[],
    questions:[],
    notes:[],
    lastThought:null,
  };
}

/* Example/demo content — shown ONLY when the user explicitly chooses
   "View example". Never written to real storage, never merged with
   the user's own ideas/questions/notes. */
function demoState(){
  const t0 = now();
  const day = 86400000;
  const idea1 = {
    id:uid(), type:'idea', title:'THE LAST ROOM', description:'A horror game where the player keeps returning to the same room, and something subtle has changed each time they come back.',
    stage:'building', progress:82, tags:['Games','Horror'], transcript:'', createdAt:t0-9*day, connectedQuestions:[]
  };
  const idea2 = {
    id:uid(), type:'idea', title:'Romance Story Game', description:'Choice-driven romance game where decisions genuinely reshape the relationship, leading to three distinct endings.',
    stage:'brewing', progress:12, tags:['Games','Narrative'], transcript:'I just had an idea for a romance game where the choices actually change the relationship and there are three different endings.', createdAt:t0-3*day, connectedQuestions:[]
  };
  const idea3 = {
    id:uid(), type:'idea', title:'Interactive Portfolio', description:'A personal site that feels more like a playable space than a static resume.',
    stage:'inbox', progress:0, tags:['Web'], transcript:'', createdAt:t0-1*day, connectedQuestions:[]
  };
  const q1 = {
    id:uid(), type:'question', text:'How are mobile games published on the Play Store?',
    why:'Because I want to publish my first game and let other people play it.',
    know:'', found:'', answer:'',
    status:'exploring', topic:'Games', tags:['Technology','Games'], createdAt:t0-2*day-3600000, transcript:'',
    connectedIdeas:[idea1.id], parentId:null,
  };
  const q2 = {
    id:uid(), type:'question', text:'Can I publish a browser game as an Android app?',
    why:'', know:'Browser games can sometimes be wrapped for app stores.', found:'', answer:'',
    status:'unanswered', topic:'Games', tags:['Technology'], createdAt:t0-2*day, transcript:'',
    connectedIdeas:[], parentId:q1.id,
  };
  const q3 = {
    id:uid(), type:'question', text:'How does AI actually generate working code?',
    why:'', know:'', found:'', answer:'',
    status:'keeplearning', topic:'AI', tags:['Technology'], createdAt:t0-5*day, transcript:'',
    connectedIdeas:[], parentId:null,
  };
  const q4 = {
    id:uid(), type:'question', text:'How does game physics work?',
    why:'', know:'', found:'', answer:'',
    status:'exploring', topic:'Games', tags:['Games'], createdAt:t0-6*day, transcript:'',
    connectedIdeas:[idea1.id], parentId:null,
  };
  q1.nextIds = [q2.id];
  q2.nextIds = [];
  q3.nextIds = [];
  q4.nextIds = [];
  idea1.connectedQuestions = [q1.id, q4.id];

  const note1 = {
    id:uid(), type:'note', text:'What if the second playthrough of The Last Room completely changes the meaning of the first?', createdAt:t0-3600000
  };

  return {
    ideas:[idea1, idea2, idea3],
    questions:[q1,q2,q3,q4],
    notes:[note1],
    lastThought:{text:note1.text, createdAt:note1.createdAt},
  };
}

/* ---------- one-time cleanup migration ----------
   Some devices already had the old hardcoded seed entries saved
   (from before this fix existed), sitting mixed in with real user
   content. This strips ONLY entries that exactly match the known
   seed fingerprints (title + description / exact text) — a real
   user's own content can't accidentally match these, so nothing
   genuine is ever removed. Runs once; harmless no-op afterwards. */
const SEED_FINGERPRINTS = {
  ideas: [
    {title:'THE LAST ROOM', description:'A horror game where the player keeps returning to the same room, and something subtle has changed each time they come back.'},
    {title:'Romance Story Game', description:'Choice-driven romance game where decisions genuinely reshape the relationship, leading to three distinct endings.'},
    {title:'Interactive Portfolio', description:'A personal site that feels more like a playable space than a static resume.'},
  ],
  questions: [
    {text:'How are mobile games published on the Play Store?'},
    {text:'Can I publish a browser game as an Android app?'},
    {text:'How does AI actually generate working code?'},
    {text:'How does game physics work?'},
  ],
  notes: [
    {text:'What if the second playthrough of The Last Room completely changes the meaning of the first?'},
  ],
};
function stripKnownSeedContent(s){
  if(!s || typeof s !== 'object') return {state:s, changed:false};
  let changed = false;

  if(Array.isArray(s.ideas)){
    const before = s.ideas.length;
    s.ideas = s.ideas.filter(i => !SEED_FINGERPRINTS.ideas.some(f => f.title===i.title && f.description===i.description));
    if(s.ideas.length !== before) changed = true;
  }

  if(Array.isArray(s.questions)){
    const before = s.questions.length;
    const removedIds = [];
    s.questions = s.questions.filter(q => {
      const isSeed = SEED_FINGERPRINTS.questions.some(f => f.text===q.text);
      if(isSeed) removedIds.push(q.id);
      return !isSeed;
    });
    if(s.questions.length !== before){
      changed = true;
      // clean up any dangling references left behind on real entries
      (s.ideas||[]).forEach(i=>{ if(Array.isArray(i.connectedQuestions)) i.connectedQuestions = i.connectedQuestions.filter(id=>!removedIds.includes(id)); });
      s.questions.forEach(q=>{
        if(Array.isArray(q.nextIds)) q.nextIds = q.nextIds.filter(id=>!removedIds.includes(id));
        if(q.parentId && removedIds.includes(q.parentId)) q.parentId = null;
        if(Array.isArray(q.connectedIdeas)) q.connectedIdeas = q.connectedIdeas.filter(id=>!removedIds.includes(id));
      });
    }
  }

  if(Array.isArray(s.notes)){
    const before = s.notes.length;
    const removedTexts = [];
    s.notes = s.notes.filter(n => {
      const isSeed = SEED_FINGERPRINTS.notes.some(f => f.text===n.text);
      if(isSeed) removedTexts.push(n.text);
      return !isSeed;
    });
    if(s.notes.length !== before){
      changed = true;
      if(s.lastThought && removedTexts.includes(s.lastThought.text)){
        const latest = s.notes.length ? s.notes.reduce((a,b)=> b.createdAt>a.createdAt?b:a) : null;
        s.lastThought = latest ? {text:latest.text, createdAt:latest.createdAt} : null;
      }
    }
  }

  return {state:s, changed};
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      const {state:cleaned, changed} = stripKnownSeedContent(parsed);
      if(changed){ saveState(cleaned); }
      return cleaned;
    }
  }catch(e){ console.warn('Could not read local storage', e); }
  // Brand-new user/device: start with a genuinely empty, personal space.
  // No sample ideas/questions/notes are written here.
  const fresh = emptyVaultState();
  saveState(fresh);
  return fresh;
}
function saveState(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  catch(e){ console.warn('Could not save local storage', e); }
}

let state = loadState();
function persist(){ saveState(state); }
function isVaultEmpty(){
  return state.ideas.length===0 && state.questions.length===0 && state.notes.length===0;
}

/* ---------- helpers ---------- */
function findIdea(id){ return state.ideas.find(i=>i.id===id); }
function findQuestion(id){ return state.questions.find(q=>q.id===id); }
function stageInfo(id){ return STAGES.find(s=>s.id===id) || STAGES[0]; }
function statusInfo(id){ return Q_STATUSES.find(s=>s.id===id) || Q_STATUSES[0]; }
function statusClass(id){ return {unanswered:'st-unanswered',exploring:'st-exploring',understood:'st-understood',keeplearning:'st-keeplearning'}[id]||''; }

function timeAgo(ts){
  const diff = Math.max(0, now()-ts);
  const min = Math.floor(diff/60000);
  if(min < 1) return 'just now';
  if(min < 60) return min+' minute'+(min===1?'':'s')+' ago';
  const hr = Math.floor(min/60);
  if(hr < 24) return hr+' hour'+(hr===1?'':'s')+' ago';
  const d = Math.floor(hr/24);
  if(d < 30) return d+' day'+(d===1?'':'s')+' ago';
  const mo = Math.floor(d/30);
  return mo+' month'+(mo===1?'':'s')+' ago';
}
function esc(str){
  return (str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function nl2br(str){ return esc(str).replace(/\n/g,'<br>'); }

/* title generator for voice-captured ideas */
function generateIdeaTitle(transcript){
  let t = transcript.trim();
  const stripPatterns = [
    /^i just had an idea for (a |an )?/i,
    /^i had an idea for (a |an )?/i,
    /^i want to make (a |an )?/i,
    /^i want to build (a |an )?/i,
    /^i wanna make (a |an )?/i,
    /^what if (there was |we made )?(a |an )?/i,
    /^idea[:\-]?\s*/i,
  ];
  for(const p of stripPatterns){ t = t.replace(p,''); }
  t = t.split(/[,.]| where | that | which /i)[0];
  t = t.trim();
  if(t.length > 46) t = t.slice(0,46).trim();
  if(!t) t = transcript.slice(0,40);
  return t.charAt(0).toUpperCase()+t.slice(1);
}
function generateQuestionTitle(transcript){
  let t = transcript.trim();
  if(!/[?]$/.test(t)) t += '?';
  return t.charAt(0).toUpperCase()+t.slice(1);
}

/* ============================================================
   ROUTER
   ============================================================ */
function currentRoute(){
  const h = location.hash.slice(1) || '/overview';
  const [path, query] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = {};
  if(query){ query.split('&').forEach(pair=>{ const [k,v]=pair.split('='); params[k]=decodeURIComponent(v||''); }); }
  return {parts, params};
}
window.addEventListener('hashchange', render);

function navigate(hash){ location.hash = hash; }

/* ============================================================
   UI STATE (modals etc, not persisted)
   ============================================================ */
let ui = {
  sidebarOpen:false,
  captureOpen:false,
  captureStep:'type', // type | form
  captureType:null,
  voiceOpen:false,
  voiceState:'ready', // ready|requesting_permission|starting|listening|processing|success|error|unsupported
  voiceTranscript:'',
  voiceErrorMessage:'',
  voiceStep:'record', // record|choose
  toast:null,
  demoOpen:false, // separate, opt-in "View example" preview — never touches real state
};

function showToast(msg){
  ui.toast = msg;
  render();
  setTimeout(()=>{ ui.toast=null; renderToastOnly(); }, 2200);
}
function renderToastOnly(){
  const existing = document.querySelector('.toast');
  if(existing) existing.remove();
}

/* ============================================================
   RENDER — root
   ============================================================ */
function render(){
  const root = document.getElementById('app');
  const {parts, params} = currentRoute();
  const section = parts[0] || 'overview';

  root.innerHTML = `
    ${ui.sidebarOpen ? `<div class="sidebar-scrim show" onclick="ui.sidebarOpen=false;render();"></div>` : ''}
    ${renderSidebar(section)}
    <div class="main">
      ${renderTopbar()}
      <div class="content">
        ${renderSection(parts, params)}
      </div>
    </div>
    ${ui.captureOpen ? renderCaptureModal() : ''}
    ${ui.voiceOpen ? renderVoiceModal() : ''}
    ${ui.demoOpen ? renderDemoModal() : ''}
    ${ui.toast ? `<div class="toast">✓ ${esc(ui.toast)}</div>` : ''}
  `;
  wireGlobalEvents();
}

function renderSidebar(section){
  const ideaCount = (stageId)=> state.ideas.filter(i=>i.stage===stageId).length;
  const qCount = state.questions.length;
  const navItem = (hash, icon, label, active, count)=>`
    <a class="nav-item ${active?'active':''}" href="#${hash}">
      <span class="dot"></span><span class="nav-icon">${icon}</span>${label}
      ${count!=null?`<span class="nav-count">${count}</span>`:''}
    </a>`;
  return `
  <div class="sidebar ${ui.sidebarOpen?'open':''}">
    <div class="brand">
      <div class="brand-mark">iv</div>
      <div class="brand-name">Idea Vault</div>
    </div>
    <div class="nav-group">
      ${navItem('/overview','◆','Overview', section==='overview')}
    </div>
    <div class="nav-section-label">Ideas</div>
    <div class="nav-group">
      ${STAGES.map(s=>navItem('/stage/'+s.id, s.icon, s.label, section==='stage', ideaCount(s.id))).join('')}
    </div>
    <div class="nav-divider"></div>
    <div class="nav-group">
      ${navItem('/questions','❓','Questions', section==='questions', qCount)}
      ${navItem('/collections','▤','Collections', section==='collections')}
    </div>
    <div class="sidebar-footer">
      <button class="mic-fab" onclick="openVoice(event)">
        <span class="mic-dot">🎙️</span> Voice capture
      </button>
    </div>
  </div>`;
}

function renderTopbar(){
  return `
  <div class="topbar">
    <button class="hamburger" onclick="ui.sidebarOpen=true;render();">☰</button>
    <div class="search-wrap">
      <span class="sicon">⌕</span>
      <input id="globalSearch" type="text" placeholder="Search ideas and questions…" value="${esc(ui._searchVal||'')}"
        onkeydown="if(event.key==='Enter'){ navigate('/search?q='+encodeURIComponent(this.value)); }">
    </div>
    <div class="topbar-spacer"></div>
    <button class="btn btn-ghost" onclick="openVoice(event)" title="Voice capture">🎙️</button>
    <button class="btn btn-primary" onclick="openCapture()">+ <span class="btn-text">Capture</span></button>
  </div>`;
}

function renderSection(parts, params){
  const section = parts[0] || 'overview';
  try{
    if(section==='overview') return renderOverview();
    if(section==='stage') return renderStageBoard(parts[1]);
    if(section==='questions') return renderQuestionsHome(parts[1]);
    if(section==='question' && parts[1]) return renderQuestionDetail(parts[1]);
    if(section==='idea' && parts[1]) return renderIdeaDetail(parts[1]);
    if(section==='collections') return renderCollections(params);
    if(section==='search') return renderSearch(params);
    if(section==='notes') return renderNotes();
  }catch(e){
    console.error(e);
    return `<div class="empty-state"><div class="e-icon">⚠</div><h3>Something went sideways</h3><p>${esc(e.message)}</p></div>`;
  }
  return renderOverview();
}

/* ============================================================
   OVERVIEW
   ============================================================ */
function renderOverview(){
  if(isVaultEmpty()){ return renderEmptyOverview(); }

  const building = state.ideas.filter(i=>i.stage==='building').sort((a,b)=>b.progress-a.progress)[0];
  const recentIdeas = [...state.ideas].sort((a,b)=>b.createdAt-a.createdAt).slice(0,3);
  const exploring = state.questions.filter(q=>q.status==='exploring'||q.status==='keeplearning')
    .sort((a,b)=>b.createdAt-a.createdAt).slice(0,4);
  const lastThought = state.lastThought;

  return `
    <div class="overview-hero">
      <div class="page-eyebrow">Overview</div>
      <h1>Good day. What's on your mind?</h1>
      <p>A home for what you want to build, and a notebook for what you're curious about.</p>
      ${building ? `
      <div class="focus-card">
        <div class="fc-ico">⚒</div>
        <div class="fc-body">
          <div class="fc-title"><a href="#/idea/${building.id}">${esc(building.title)}</a></div>
          <div class="fc-stage">Currently building · ${building.progress}% along</div>
        </div>
        <div class="progress-track" style="width:120px;flex-shrink:0;">
          <div class="progress-fill" style="width:${building.progress}%"></div>
        </div>
      </div>` : ''}
    </div>

    <div class="section-head">
      <div class="section-title">Recent ideas</div>
      <a class="section-link" href="#/stage/inbox">View all →</a>
    </div>
    ${recentIdeas.length ? `<div class="grid">${recentIdeas.map(ideaCard).join('')}</div>` :
      emptyState('💡','No ideas yet','Capture your first spark of a thing you might build.')}

    <div class="section-head">
      <div class="section-title">Questions I'm exploring</div>
      <a class="section-link" href="#/questions/learning">View learning →</a>
    </div>
    ${exploring.length ? `<div class="grid">${exploring.map(questionCard).join('')}</div>` :
      emptyState('❓','Nothing brewing','Questions you\'re exploring or want to keep learning about will show up here.')}

    ${lastThought ? `
    <div class="section-head"><div class="section-title">Recent thought</div></div>
    <div class="thought-strip">
      <div class="ts-ico">🎙️</div>
      <div>
        <blockquote>"${esc(lastThought.text)}"</blockquote>

/* ============================================================
   QUESTION DETAIL
   ============================================================ */
function renderQuestionDetail(id){
  const q = findQuestion(id);
  if(!q) return emptyState('❓','Question not found','It may have been removed.');
  const st = statusInfo(q.status);
  const parent = q.parentId ? findQuestion(q.parentId) : null;
  const nextQs = (q.nextIds||[]).map(nid=>findQuestion(nid)).filter(Boolean);
  const connectedIdeas = (q.connectedIdeas||[]).map(iid=>findIdea(iid)).filter(Boolean);
  const allIdeas = state.ideas;

  // build full chain: walk up to root, then down through this node's known next chain
  let chainUp = [];
  let cursor = parent;
  while(cursor){ chainUp.unshift(cursor); cursor = cursor.parentId ? findQuestion(cursor.parentId) : null; }

  return `
    <a class="detail-back" href="#/questions">← Questions</a>
    <div class="detail-header">
      <div>
        <div class="page-eyebrow">❓ Question</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <select class="inline-select" onchange="updateQuestionStatus('${q.id}', this.value)">
          ${Q_STATUSES.map(s=>`<option value="${s.id}" ${s.id===q.status?'selected':''}>${s.icon} ${s.label}</option>`).join('')}
        </select>
        <button class="btn btn-danger btn-sm" onclick="deleteQuestion('${q.id}')">Delete</button>
      </div>
    </div>

    <div class="field-block">
      <div class="field-label">The question</div>
      <div class="field-box quote" contenteditable="true" onblur="updateQuestionField('${q.id}','text',this.innerText)">${esc(q.text)}</div>
    </div>

    ${q.transcript ? `
    <div class="field-block">
      <div class="field-label">🎙️ Original voice transcript</div>
      <div class="field-box" style="font-style:italic;color:var(--text-dim);">"${esc(q.transcript)}"</div>
    </div>` : ''}

    <div class="field-block">
      <div class="field-label">Why I want to know <span style="color:var(--text-faint);">(optional)</span></div>
      <textarea class="editable" placeholder="Why does this matter to you?" onblur="updateQuestionField('${q.id}','why',this.value)">${esc(q.why)}</textarea>
    </div>

    <div class="field-block">
      <div class="field-label">What I know</div>
      <textarea class="editable" placeholder="Record your current understanding…" onblur="updateQuestionField('${q.id}','know',this.value)">${esc(q.know)}</textarea>
    </div>

    <div class="field-block">
      <div class="field-label">What I found</div>
      <textarea class="editable" placeholder="Discoveries, links, examples, notes…" onblur="updateQuestionField('${q.id}','found',this.value)">${esc(q.found)}</textarea>
    </div>

    <div class="field-block">
      <div class="field-label">My answer</div>
      <textarea class="editable" placeholder="Explain it in your own words, once you've got it…" onblur="updateQuestionField('${q.id}','answer',this.value)">${esc(q.answer)}</textarea>
    </div>

    <div class="field-block">
      <div class="field-label">Learning path</div>
      <div class="chain-vis">
        ${chainUp.map(c=>`<div class="chain-node"><a href="#/question/${c.id}">${esc(c.text)}</a></div><div class="chain-connector"></div>`).join('')}
        <div class="chain-node current">${esc(q.text)}</div>
        ${nextQs.map(n=>`<div class="chain-connector"></div><div class="chain-node"><a href="#/question/${n.id}">${esc(n.text)}</a></div>`).join('')}
      </div>
      <div style="margin-top:12px;">
        <button class="btn btn-sm" onclick="openFollowupPrompt('${q.id}')">+ Next question</button>
      </div>
    </div>

    <div class="field-block">
      <div class="field-label">Ideas this question connected to</div>
      <div>
        ${connectedIdeas.map(idea=>`
          <span class="link-chip idea"><span class="lc-ico">💡</span>${esc(idea.title)}<span class="lc-x" onclick="unlinkIdeaFromQuestion('${q.id}','${idea.id}')">✕</span></span>
        `).join('')}
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">
        <select class="inline-select" onchange="if(this.value){linkIdeaToQuestion('${q.id}', this.value); this.value='';}">
          <option value="">Link an existing idea…</option>
          ${allIdeas.filter(i=>!(q.connectedIdeas||[]).includes(i.id)).map(i=>`<option value="${i.id}">${esc(i.title)}</option>`).join('')}
        </select>
        <button class="btn btn-sm" onclick="createIdeaFromQuestion('${q.id}')">+ New idea from this</button>
      </div>
    </div>

    <div class="card-meta">Topic: ${esc(q.topic||'General')} · Added ${timeAgo(q.createdAt)}</div>
  `;
}

/* ============================================================
   SEARCH
   ============================================================ */
function renderSearch(params){
  const q = (params.q||'').toLowerCase();
  const filter = params.filter || 'all';
  ui._searchVal = params.q||'';

  const matchIdea = (i)=> !q || [i.title,i.description,(i.tags||[]).join(' ')].join(' ').toLowerCase().includes(q);
  const matchQuestion = (qq)=> !q || [qq.text,qq.why,qq.know,qq.found,qq.answer,(qq.tags||[]).join(' ')].join(' ').toLowerCase().includes(q);
  const matchNote = (n)=> !q || n.text.toLowerCase().includes(q);

  let ideas = state.ideas.filter(matchIdea);
  let questions = state.questions.filter(matchQuestion);
  let learning = questions.filter(qq=>qq.status==='exploring'||qq.status==='keeplearning');
  let notes = state.notes.filter(matchNote);

  const tabs = [
    {id:'all', label:'All'},
    {id:'ideas', label:'Ideas'},
    {id:'questions', label:'Questions'},
    {id:'learning', label:'Learning'},
    {id:'notes', label:'Notes'},
  ];

  let body = '';
  if(filter==='ideas'){ body = ideas.length ? `<div class="grid">${ideas.map(ideaCard).join('')}</div>` : emptyState('💡','No matching ideas','Try a different search term.'); }
  else if(filter==='questions'){ body = questions.length ? `<div class="grid">${questions.map(questionCard).join('')}</div>` : emptyState('❓','No matching questions','Try a different search term.'); }
  else if(filter==='learning'){ body = learning.length ? `<div class="grid">${learning.map(questionCard).join('')}</div>` : emptyState('📚','Nothing here','Try a different search term.'); }
  else if(filter==='notes'){ body = notes.length ? `<div class="grid">${notes.map(noteCard).join('')}</div>` : emptyState('📝','No matching notes','Try a different search term.'); }
  else {
    const total = ideas.length+questions.length+notes.length;
    body = total ? `
      ${ideas.length?`<div class="section-head"><div class="section-title">Ideas</div></div><div class="grid">${ideas.map(ideaCard).join('')}</div>`:''}
      ${questions.length?`<div class="section-head"><div class="section-title">Questions</div></div><div class="grid">${questions.map(questionCard).join('')}</div>`:''}
      ${notes.length?`<div class="section-head"><div class="section-title">Notes</div></div><div class="grid">${notes.map(noteCard).join('')}</div>`:''}
    ` : emptyState('⌕','Nothing found', q ? `No matches for "${q}".` : 'Type something in the search bar above.');
  }

  return `
    <div class="page-eyebrow">Search</div>
    <h1 class="page-title">${q?`Results for "${esc(params.q)}"`:'Search'}</h1>
    <div class="filter-tabs">
      ${tabs.map(t=>`<a class="filter-tab ${filter===t.id?'active':''}" href="#/search?q=${encodeURIComponent(params.q||'')}&filter=${t.id}">${t.label}</a>`).join('')}
    </div>
    ${body}
  `;
}

/* ============================================================
   MUTATIONS
   ============================================================ */
function updateIdeaField(id, field, value){
  const idea = findIdea(id); if(!idea) return;
  idea[field] = value;
  persist();
  if(field!=='title' && field!=='description') render();
}
function updateQuestionField(id, field, value){
  const q = findQuestion(id); if(!q) return;
  q[field] = value;
  persist();
}
function updateQuestionStatus(id, status){
  const q = findQuestion(id); if(!q) return;
  q.status = status; persist(); render();
}
function deleteIdea(id){
  if(!confirm('Delete this idea? This can\'t be undone.')) return;
  state.ideas = state.ideas.filter(i=>i.id!==id);
  state.questions.forEach(q=>{ q.connectedIdeas = (q.connectedIdeas||[]).filter(x=>x!==id); });
  persist();
  navigate('/overview');
}
function deleteQuestion(id){
  if(!confirm('Delete this question? This can\'t be undone.')) return;
  state.questions = state.questions.filter(q=>q.id!==id);
  state.questions.forEach(q=>{ q.nextIds = (q.nextIds||[]).filter(x=>x!==id); if(q.parentId===id) q.parentId=null; });
  state.ideas.forEach(i=>{ i.connectedQuestions = (i.connectedQuestions||[]).filter(x=>x!==id); });
  persist();
  navigate('/questions');
}
function linkIdeaToQuestion(questionId, ideaId){
  const q = findQuestion(questionId), idea = findIdea(ideaId);
  if(!q || !idea) return;
  q.connectedIdeas = q.connectedIdeas || [];
  if(!q.connectedIdeas.includes(ideaId)) q.connectedIdeas.push(ideaId);
  idea.connectedQuestions = idea.connectedQuestions || [];
  if(!idea.connectedQuestions.includes(questionId)) idea.connectedQuestions.push(questionId);
  persist(); render();
}
function unlinkIdeaFromQuestion(questionId, ideaId){
  const q = findQuestion(questionId), idea = findIdea(ideaId);
  if(q) q.connectedIdeas = (q.connectedIdeas||[]).filter(x=>x!==ideaId);
  if(idea) idea.connectedQuestions = (idea.connectedQuestions||[]).filter(x=>x!==questionId);
  persist(); render();
}
function createIdeaFromQuestion(questionId){
  const q = findQuestion(questionId); if(!q) return;
  const idea = {
    id:uid(), type:'idea', title:'New idea from a question', description:'',
    stage:'inbox', progress:0, tags:[...(q.tags||[])], transcript:'', createdAt:now(), connectedQuestions:[questionId]
  };
  state.ideas.push(idea);
  q.connectedIdeas = q.connectedIdeas || [];
  q.connectedIdeas.push(idea.id);
  persist();
  navigate('/idea/'+idea.id);
}
function openFollowupPrompt(parentId){
  const text = prompt('What\'s the next question?');
  if(!text || !text.trim()) return;
  const parent = findQuestion(parentId); if(!parent) return;
  const nq = {
    id:uid(), type:'question', text:text.trim(), why:'', know:'', found:'', answer:'',

/* ============================================================
   VOICE CAPTURE
   State machine: IDLE(ready) -> REQUESTING_PERMISSION -> STARTING
                -> LISTENING -> PROCESSING -> STOPPING -> IDLE
   Also: ERROR, UNSUPPORTED, SUCCESS as terminal-ish states reached
   from any point above.
   ============================================================ */
let recognition = null;                 // the single live SpeechRecognition instance (or null)
let recognitionSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);
let voiceSessionToken = 0;               // bumped every (re)start; stale callbacks are ignored
let restartAttempts = 0;                 // caps auto-restart-on-unexpected-end
const MAX_AUTO_RESTARTS = 0; // auto-restart re-hears a sliver of audio at each restart boundary on Android, causing duplicated words — safer to stop cleanly and let the user tap again
let intentionalStop = false;             // true once the user has asked to stop/cancel
let finalTranscript = '';                // committed text, survives silent internal restarts
// How many entries of the CURRENT session's evt.results we have already committed to
// finalTranscript. This is the actual fix for the duplicate-word bug: some browsers
// (notably Chrome after an internal restart) report evt.resultIndex unreliably — it can
// come back as 0 even though earlier results were already finalized, which caused the old
// code (which trusted resultIndex and did `finalTranscript += ...` for whatever range the
// event claimed was "new") to re-append text that was already committed. Instead we walk
// evt.results from the start every time and only ever commit an index once, tracked here —
// so re-delivery of an index we've already seen is a no-op, regardless of what resultIndex says.
let sessionFinalizedCount = 0;

/* ---- guards against duplicated words at the seam between two finalized chunks.
   Android Chrome's continuous recognition can independently re-segment and emit a
   new "final" result that overlaps words already committed — this isn't only caused
   by restarts, so it's caught here at the text level rather than by session bookkeeping.
   Compares the tail of what's already committed against the head of the new chunk and
   trims the matching overlap before appending. ---- */
function appendFinalChunk(existing, newChunk){
  const newWords = newChunk.trim().split(/\s+/).filter(Boolean);
  if(!newWords.length) return existing;
  const existingWords = existing.trim().split(/\s+/).filter(Boolean);
  const maxOverlap = Math.min(6, existingWords.length, newWords.length);
  let overlap = 0;
  for(let n = maxOverlap; n > 0; n--){
    const tail = existingWords.slice(-n).join(' ').toLowerCase();
    const head = newWords.slice(0, n).join(' ').toLowerCase();
    if(tail === head){ overlap = n; break; }
  }
  const trimmedNew = newWords.slice(overlap).join(' ');
  return existing + (trimmedNew ? trimmedNew + ' ' : '');
}

/* ---- waveform animation, driven by real recognition activity (no second live mic stream) ---- */
let waveformRafId = null;
let simulatedLevel = 0;
let waveformSupported = !!window.requestAnimationFrame;

/* ---- typing/key-click sound (Web Audio API, output-only, never touches mic input) ---- */
let audioCtx = null;
let typingSoundEnabled = (function(){
  try{ return localStorage.getItem('ideaVaultVoiceSound') !== 'off'; }catch(e){ return true; }
})();
let typingActive = false;
let typingLoopId = null;
let lastSpeechActivityAt = 0;
let currentAudioLevel = 0;              // 0..1, updated from tickWaveform's simulated level
const TYPING_SILENCE_CUTOFF_MS = 450;    // how long to wait after real audio drops before going quiet

function ensureAudioContext(){
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  if(!audioCtx){
    try{ audioCtx = new Ctx(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){
    audioCtx.resume().catch(()=>{});
  }
  return audioCtx;
}
function createNoiseBuffer(ctx, duration){
  const size = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, size, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<size;i++){ data[i] = Math.random()*2-1; }
  return buffer;
}
/* ---- rough, mechanical-feeling key click (used while interim words are streaming in) ---- */
function fireTypingClick(ctx){
  try{
    const t0 = ctx.currentTime;
    const peak = 0.09 + Math.random()*0.06;

    // filtered noise burst gives it a rough, textured "clack" instead of a clean beep
    const noiseSrc = ctx.createBufferSource();
    noiseSrc.buffer = createNoiseBuffer(ctx, 0.025);
    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.setValueAtTime(1600 + Math.random()*1600, t0);
    bp.Q.value = 0.9 + Math.random()*0.6;
    const noiseGain = ctx.createGain();
    noiseGain.gain.setValueAtTime(0, t0);
    noiseGain.gain.linearRampToValueAtTime(peak, t0 + 0.002);
    noiseGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.045);
    noiseSrc.connect(bp); bp.connect(noiseGain); noiseGain.connect(ctx.destination);
    noiseSrc.start(t0); noiseSrc.stop(t0 + 0.05);

    // low-frequency thud underneath gives the click some body/weight, like a real keypress
    const osc = ctx.createOscillator();
    const oGain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(130 + Math.random()*70, t0);
    oGain.gain.setValueAtTime(0, t0);
    oGain.gain.linearRampToValueAtTime(peak*0.55, t0 + 0.002);
    oGain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.03);
    osc.connect(oGain); oGain.connect(ctx.destination);   // output only — never wired to any mic/input source
    osc.start(t0); osc.stop(t0 + 0.035);
  }catch(e){}
}
/* ---- bubble-pop sound: fires once per chunk of speech that actually gets locked in as final ---- */
function fireBubblePop(ctx){
  try{
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    const startFreq = 360 + Math.random()*180;
    const endFreq = startFreq * (2.1 + Math.random()*0.7);
    osc.frequency.setValueAtTime(startFreq, t0);
    osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + 0.09);
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.16, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.14);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + 0.15);
  }catch(e){}
}
function scheduleTypingClicks(){
  if(!typingActive) return;
  const ctx = audioCtx;
  if(!ctx){ typingActive = false; return; }
  if(Date.now() - lastSpeechActivityAt > TYPING_SILENCE_CUTOFF_MS){
    // no recent real speech activity — go quiet instead of clicking during silence
    typingActive = false;
    return;
  }
  fireTypingClick(ctx);
  // Cadence follows how loud/active the actual voice signal is right now, so the sound
  // speeds up while talking energetically and eases off during quieter speech — this is
  // what makes it read as "typing along with you" instead of a fixed background loop.
  const level = currentAudioLevel; // 0..1
  const baseDelay = 95 - level*55;               // louder speech -> shorter gaps (faster "typing")
  const jitter = Math.random()*50;
  const delay = Math.max(35, baseDelay + jitter);
  typingLoopId = setTimeout(scheduleTypingClicks, delay);
}
function pingTypingSound(){
  if(!typingSoundEnabled) return;
  const ctx = ensureAudioContext();
  if(!ctx) return;
  lastSpeechActivityAt = Date.now();
  if(!typingActive){ typingActive = true; scheduleTypingClicks(); }
}
function pingBubblePop(){
  if(!typingSoundEnabled) return;
  const ctx = ensureAudioContext();
  if(!ctx) return;
  fireBubblePop(ctx);
}
function stopTypingSound(){
  typingActive = false;
  if(typingLoopId){ clearTimeout(typingLoopId); typingLoopId = null; }
}
function setTypingSoundEnabled(val){
  typingSoundEnabled = !!val;
  try{ localStorage.setItem('ideaVaultVoiceSound', typingSoundEnabled ? 'on' : 'off'); }catch(e){}
  if(!typingSoundEnabled) stopTypingSound();
}
window.setTypingSoundEnabled = setTypingSoundEnabled;

/* ---- modal open/close ---- */
function openVoice(e){
  if(e) e.preventDefault();
  ensureAudioContext(); // prime audio from this user gesture so playback isn't blocked later
  intentionalStop = false;
  ui.voiceOpen = true; ui.voiceStep='record'; ui.voiceTranscript=''; ui.voiceErrorMessage='';
  ui.voiceState = recognitionSupported ? 'ready' : 'unsupported';

function closeVoice(){

/* ---- single-instance guard: always fully tears down any live/starting session ---- */
function forceStopRecognition(){
  voiceSessionToken++;                  // invalidate any in-flight callbacks from an old session
  restartAttempts = MAX_AUTO_RESTARTS;  // make sure a late onend can't trigger an auto-restart
  if(recognition){
    const rec = recognition;
    recognition = null;
    rec.onstart = null; rec.onresult = null; rec.onerror = null; rec.onend = null;
    try{ rec.abort(); }catch(e){}
  }
  stopTypingSound();
  stopWaveformMeter();
}

/* ---- start a brand-new voice-capture attempt (user tapped the mic) ---- */
function startVoiceRecording(){
  if(ui.voiceState==='requesting_permission' || ui.voiceState==='starting' || ui.voiceState==='listening') return; // ignore double taps
  if(!recognitionSupported){ ui.voiceState='unsupported'; render(); return; }

  forceStopRecognition();   // guarantee there is never more than one session
  ensureAudioContext();     // resume/create from this click's user gesture

  intentionalStop = false;
  restartAttempts = 0;
  finalTranscript = '';
  ui.voiceTranscript = '';
  ui.voiceErrorMessage = '';
  ui.voiceState = 'requesting_permission';
  render();

  const primePermission = (navigator.mediaDevices && navigator.mediaDevices.getUserMedia)
    ? navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
        // This stream is used ONLY to resolve the permission prompt up front, then released
        // immediately. Keeping it alive would mean two simultaneous live mic captures — this
        // one, plus SpeechRecognition's own independent capture once rec.start() runs — and on
        // many Android devices the OS only grants exclusive mic access to one consumer at a
        // time, which silently starves recognition of audio (listening state, empty transcript).
        // The waveform below is driven from real recognition activity instead.
        stream.getTracks().forEach(t=>{ try{ t.stop(); }catch(e){} });
      }).catch(err=>{
        // Permission denied/unavailable — let recognition.start() surface the concrete error,
        // but remember an explicit denial so we can show a clearer message.
        if(err && err.name === 'NotAllowedError') ui.voiceErrorMessage = 'Microphone access was blocked.';
      })
    : Promise.resolve();

  primePermission.then(beginRecognitionSession, beginRecognitionSession);
}

/* ---- waveform level, driven by real recognition activity (onresult), not a second mic stream ---- */
function startWaveformMeter(){
  stopWaveformMeter();
  if(!waveformSupported){ return; }
  waveformRafId = requestAnimationFrame(tickWaveform);
}
function tickWaveform(){
  // lastSpeechActivityAt is updated by pingTypingSound(), which onresult already calls on
  // every recognized chunk — so this level rises the instant real speech is recognized and
  // decays smoothly afterward, without needing its own independent audio capture.
  const sinceActivity = Date.now() - lastSpeechActivityAt;
  const target = sinceActivity < 250 ? 1 : Math.max(0, 1 - sinceActivity/500);
  simulatedLevel += (target - simulatedLevel) * 0.3;
  currentAudioLevel = simulatedLevel;
  applyWaveformLevel(simulatedLevel);
  waveformRafId = requestAnimationFrame(tickWaveform);
}
function applyWaveformLevel(level){
  const bars = document.querySelectorAll('.waveform span');
  if(!bars.length) return;
  bars.forEach((bar, idx)=>{
    const variance = 0.75 + Math.sin(idx*1.7 + Date.now()/180)*0.25; // per-bar wobble so it doesn't move as one flat block
    const scale = Math.max(0.12, Math.min(1, level*variance));
    bar.style.transform = `scaleY(${scale.toFixed(3)})`;
  });
}
function stopWaveformMeter(){
  if(waveformRafId){ cancelAnimationFrame(waveformRafId); waveformRafId = null; }
  simulatedLevel = 0;
  document.querySelectorAll('.waveform span').forEach(bar=>{ bar.style.transform = 'scaleY(0.12)'; });
}

/* ---- create + start exactly one SpeechRecognition instance, all handlers wired first ---- */
function beginRecognitionSession(){
  if(intentionalStop) return; // user cancelled while permission was still resolving
  if(!recognitionSupported){ ui.voiceState = 'unsupported'; render(); return; }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  const sessionToken = ++voiceSessionToken;
  sessionFinalizedCount = 0; // a brand-new recognition session gets a brand-new evt.results list, indexed from 0

  rec.lang = navigator.language || 'en-US'; // match the device's actual locale instead of forcing US English
  rec.interimResults = true;
  rec.continuous = true;
  if('maxAlternatives' in rec) rec.maxAlternatives = 1;

  // Attach every handler BEFORE calling start().
  rec.onstart = ()=>{
    if(sessionToken !== voiceSessionToken) return;
    ui.voiceState = 'listening';
    startWaveformMeter();
    render();
  };
  rec.onresult = (evt)=>{
    if(sessionToken !== voiceSessionToken) return;
    let interim = '';
    let justFinalized = false;
    // Walk the FULL results list every time and commit each index at most once
    // (tracked by sessionFinalizedCount), instead of trusting evt.resultIndex.
    // This is what actually prevents the duplicate-word bug: a final result can
    // never be added to finalTranscript twice, no matter how the browser windows
    // or re-fires the event.
    for(let i=0; i<evt.results.length; i++){
      const res = evt.results[i];
      if(res.isFinal){
        if(i >= sessionFinalizedCount){
          finalTranscript = appendFinalChunk(finalTranscript, res[0].transcript);
          sessionFinalizedCount = i + 1;
          justFinalized = true;
        }
      } else if(i >= sessionFinalizedCount){
        interim += res[0].transcript;
      }
    }
    ui.voiceTranscript = (finalTranscript + interim).trim();
    lastSpeechActivityAt = Date.now();
    if(justFinalized){ pingBubblePop(); } else { pingTypingSound(); }
    updateTranscriptOnly();
  };
  rec.onerror = (evt)=>{
    if(sessionToken !== voiceSessionToken) return;
    handleRecognitionError(evt.error);
  };
  rec.onend = ()=>{
    if(sessionToken !== voiceSessionToken) return;
    handleRecognitionEnd();
  };

  recognition = rec;
  ui.voiceState = 'starting';
  render();
  try{
    rec.start(); // start recognition exactly once for this session
  }catch(e){
    if(sessionToken !== voiceSessionToken) return;
    // Most commonly a transient InvalidStateError; treat like any other start failure.
    handleRecognitionError('start-failed');
  }
}

function handleRecognitionError(err){
  stopTypingSound();
  if(err === 'no-speech'){
    return; // benign — recognition (continuous) stays open, or onend will follow
  }
  if(err === 'aborted'){
    return; // caused by our own forceStopRecognition/stop(); the stop flow owns the state
  }
  if(err === 'not-allowed' || err === 'service-not-allowed'){
    intentionalStop = true;
    ui.voiceState = 'error';
    ui.voiceErrorMessage = 'Microphone access was blocked. Check your browser/site permissions and try again.';
    render();
    return;
  }
  if(err === 'audio-capture'){
    intentionalStop = true;
    ui.voiceState = 'error';
    ui.voiceErrorMessage = 'No microphone was found on this device.';
    render();
    return;
  }
  if(err === 'network' || err === 'start-failed'){
    // Transient — let onend decide whether a safe, capped retry is appropriate.
    return;
  }
  // Unknown error: fall through to onend's handling as well.
}

function handleRecognitionEnd(){
  stopTypingSound();
  if(intentionalStop) return; // the stop/cancel flow owns the resulting state
  if(ui.voiceState !== 'listening' && ui.voiceState !== 'starting' && ui.voiceState !== 'requesting_permission') return;

  // Recognition ended on its own (mobile suspension, provider timeout, transient error) while
  // the user still intends to keep recording. Restart safely — never duplicate the transcript
  // already captured in `finalTranscript` — and never loop forever.
  if(restartAttempts < MAX_AUTO_RESTARTS){
    restartAttempts++;
    beginRecognitionSession();
    return;
  }
  ui.voiceState = ui.voiceTranscript ? 'success' : 'error';
  if(!ui.voiceTranscript) ui.voiceErrorMessage = 'Recognition stopped unexpectedly. Please try again.';
  render();
}

      <div class="voice-state-label">Voice capture isn't available</div>
      <div class="voice-fallback">This browser doesn't support speech recognition, or access was denied.<br>You can type your thought instead.</div>
      <div class="modal-actions" style="justify-content:center;margin-top:22px;">
        <button class="btn btn-ghost" onclick="closeVoice()">Close</button>
        <button class="btn btn-primary" onclick="voiceRetype()">Type it instead</button>
      </div>
    `;
  } else if(state_ === 'ready'){
    inner = `
      <div class="mic-orb" onclick="startVoiceRecording()">🎙️</div>
      <div class="voice-state-label">Tap to speak</div>
      <div class="voice-sub">Say what's on your mind, naturally.</div>
      ${renderSoundToggle()}
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="closeVoice()">Cancel</button>
        <button class="btn btn-primary" onclick="startVoiceRecording()">Start listening</button>
      </div>
    `;
  } else if(state_ === 'requesting_permission'){
    inner = `
      <div class="mic-orb starting">🎙️</div>
      <div class="voice-state-label">Requesting microphone…</div>
      <div class="voice-sub">Allow microphone access to continue.</div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="closeVoice()">Cancel</button>
      </div>
    `;
  } else if(state_ === 'starting'){
    inner = `
      <div class="mic-orb starting">🎙️</div>
      <div class="voice-state-label">Starting…</div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="closeVoice()">Cancel</button>
      </div>
    `;
  } else if(state_ === 'listening'){
    inner = `
      <div class="mic-orb listening">🎙️</div>
      <div class="voice-state-label">Listening…</div>
      <div class="waveform${waveformSupported ? '' : ' no-audio-signal'}"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <div class="transcript-box">${esc(ui.voiceTranscript) || '<span style=\'color:var(--text-faint)\'>Listening…</span>'}</div>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-primary" onclick="stopVoiceRecording()">Tap to stop</button>
      </div>
    `;
  } else if(state_ === 'processing'){
    inner = `
      <div class="mic-orb">⏳</div>
      <div class="voice-state-label">Capturing your thought…</div>
    `;
  } else if(state_ === 'success'){
    inner = `
      <div class="voice-state-label">What is this?</div>
      <div class="voice-sub">Captured. Choose where it belongs.</div>
      <div class="transcript-box">${esc(ui.voiceTranscript)}</div>
      <div class="type-grid">
        <button class="type-opt idea" onclick="chooseVoiceType('idea')"><span class="to-ico">💡</span><span class="to-label">Idea</span><span class="to-desc">Something to create</span></button>
        <button class="type-opt question" onclick="chooseVoiceType('question')"><span class="to-ico">❓</span><span class="to-label">Question</span><span class="to-desc">Something to understand</span></button>
        <button class="type-opt learning" onclick="chooseVoiceType('learning')"><span class="to-ico">📚</span><span class="to-label">Learning</span><span class="to-desc">Go deeper later</span></button>
        <button class="type-opt note" onclick="chooseVoiceType('note')"><span class="to-ico">📝</span><span class="to-label">Note</span><span class="to-desc">Keep as-is</span></button>
      </div>
      <div class="modal-actions" style="justify-content:center;"><button class="btn btn-ghost" onclick="closeVoice()">Discard</button></div>
    `;
  } else if(state_ === 'error'){
    inner = `
      <div class="mic-orb" style="opacity:.6;">✕</div>
      <div class="voice-state-label">Couldn't capture that</div>
      <div class="voice-sub">Try again, or type it instead.</div>
      ${ui.voiceErrorMessage ? `<div class="voice-error-detail">${esc(ui.voiceErrorMessage)}</div>` : ''}
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-ghost" onclick="closeVoice()">Cancel</button>
        <button class="btn" onclick="startVoiceRecording()">Try again</button>
        <button class="btn btn-primary" onclick="voiceRetype()">Type instead</button>
      </div>
    `;
  }

  return `
  <div class="overlay" onclick="if(event.target===this) closeVoice();">
    <div class="modal voice-modal">
      ${inner}
    </div>
  </div>`;
}
function renderSoundToggle(){
  return `
    <label class="voice-sound-toggle">
      <input type="checkbox" ${typingSoundEnabled ? 'checked' : ''} onchange="setTypingSoundEnabled(this.checked)">
      <span>Typing sound while speaking</span>
    </label>
  `;
}

/* ============================================================
   GLOBAL EVENTS
   ============================================================ */
function wireGlobalEvents(){
  document.addEventListener('keydown', escHandler);
}
function escHandler(e){
  if(e.key==='Escape'){
    if(ui.voiceOpen){ closeVoice(); }
    else if(ui.captureOpen){ closeCapture(); }
  }
  document.removeEventListener('keydown', escHandler);
}

/* expose functions used inline */
window.navigate = navigate;
window.openCapture = openCapture;
window.closeCapture = closeCapture;
window.chooseCaptureType = chooseCaptureType;
window.submitCapture = submitCapture;
window.openVoice = openVoice;
window.closeVoice = closeVoice;
window.startVoiceRecording = startVoiceRecording;
window.stopVoiceRecording = stopVoiceRecording;
window.voiceRetype = voiceRetype;
window.chooseVoiceType = chooseVoiceType;
window.updateIdeaField = updateIdeaField;
window.updateQuestionField = updateQuestionField;
window.updateQuestionStatus = updateQuestionStatus;
window.deleteIdea = deleteIdea;
window.deleteQuestion = deleteQuestion;
window.linkIdeaToQuestion = linkIdeaToQuestion;
window.unlinkIdeaFromQuestion = unlinkIdeaFromQuestion;
window.createIdeaFromQuestion = createIdeaFromQuestion;
window.openFollowupPrompt = openFollowupPrompt;
window.ui = ui;

render();
</script>
</body>
</html>
